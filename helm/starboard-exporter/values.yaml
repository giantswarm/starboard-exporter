replicas: 1
registry:
  domain: gsoci.azurecr.io

image:
  name: "giantswarm/starboard-exporter"
  tag: ""  # Defaults to Chart.AppVersion if empty

imagePullSecrets: []

global:
  podSecurityStandards:
    enforced: true

pod:
  user:
    id: 1000
  group:
    id: 1000

nodeSelector: {}  # @schema additionalProperties: true
tolerations: []

# Additional custom pod labels
podLabels: {}  # @schema additionalProperties: true

# Pod securityContext
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container securityContext
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 100m
    memory: 220Mi
  limits:
    cpu: 100m
    memory: 220Mi

autoMemoryLimit:
  enabled: true
  ratio: 0.9

exporter:
  requeueMaxJitterPercent: 10

  configAuditReports:
    enabled: true

  # additionalProperties is kept open so the deprecated `enabled` key (superseded by
  # `scanners.trivy.enabled` in 1.0.0) still validates. _helpers.tpl continues to honour
  # it, so rejecting it in the schema would break charts that still set it.
  vulnerabilityReports:  # @schema additionalProperties: true
    # Shared configuration for all vulnerability scanners
    targetLabels: []
      # - image_namespace
      # - image_repository
      # - image_tag
      # - vulnerability_id

    scanners:
      trivy:
        enabled: true
      kubescape:
        enabled: false

monitoring:
  serviceMonitor:
    enabled: true
    labels: {}  # @schema additionalProperties: true
    # values.schema.json validates `relabelings` and `metricRelabelings` items
    # against the Prometheus Operator RelabelConfig (ServiceMonitor v1 schema from
    # datreeio/CRDs-catalog, pinned to a commit so the generated schema is
    # reproducible; bump the commit to pick up a newer operator). Without this the
    # generator infers the item schema from the defaults below and closes it, so
    # e.g. `targetLabel` was rejected.
    relabelings:  # @schema itemProperties: {}; itemRef: https://raw.githubusercontent.com/datreeio/CRDs-catalog/63669a570e231d4f1f8396d229a1de512bcf0a34/monitoring.coreos.com/servicemonitor_v1.json#/properties/spec/properties/endpoints/items/properties/relabelings/items
      - action: labeldrop
        regex: pod|service|container
    metricRelabelings: []  # @schema itemRef: https://raw.githubusercontent.com/datreeio/CRDs-catalog/63669a570e231d4f1f8396d229a1de512bcf0a34/monitoring.coreos.com/servicemonitor_v1.json#/properties/spec/properties/endpoints/items/properties/relabelings/items

  grafanaDashboard:
    enabled: true
    # namespace: ""

networkpolicy:
  enabled: true

psp:
  # -- Deprecated since chart 0.8.0 and ignored. PodSecurityPolicy creation is controlled by `global.podSecurityStandards.enforced`. Declared only so values that still set it keep validating against the schema.
  enabled: false  # @schema deprecated

podAnnotations: {}  # @schema additionalProperties: true

minReplicas: &minReplicas 2
maxReplicas: &maxReplicas 97  # The number of replicas is limited to 97 by the current sharding math. See https://www.giantswarm.io/blog/cveing-is-believing

customMetricsHPA:
  enabled: false
  minReplicas: *minReplicas
  maxReplicas: *maxReplicas
  metricName: scrapedurationseconds
  targetAverageValueSeconds: 10  # Scrape duration seconds timeout

verticalPodAutoscaler:
  enabled: true
  containerPolicies:
    minAllowed:
      cpu: 50m
      memory: 100Mi
    maxAllowed:
      cpu: 1
      memory: 4Gi

kedaScaledObject:
  enabled: false
  minReplicas: *minReplicas
  maxReplicas: *maxReplicas
  triggers: []
  # https://keda.sh/docs/2.12/concepts/scaling-deployments/#triggers
  # - type: prometheus
  #   metadata:
  #     serverAddress: <server, should be configurable, e.g. https://keda.svc.cluster.local:443>
  #     metricName: <metric name, configurable, e.g. scrape_duration_seconds>
  #     query: <exact query, e.g. avg_over_time(scrape_duration_seconds[1m])>
  #     threshold: <threshold, e.g. "10">
  #     authModes: <configurable, might not be required, for us it's "tls", but depends on the server https://keda.sh/docs/2.12/concepts/authentication/ )>
  #   authenticationRef: # configurable block, might not be required, depends on the server
  #     name: <auth resource name, created by prometheus owner>
  #     kind: <configurable TriggerAuthentication or ClusterTriggerAuthentication>
