# DO NOT EDIT. This file is generated by `devctl gen circleci` and kept in sync
# by the giantswarm/github align-files workflow. Change the generator in devctl
# (pkg/gen/input/circleci) or the gen.ci config in giantswarm/github, not here.
# Repo-specific jobs and workflows go in .circleci/custom.yml, which the setup
# workflow in .circleci/config.yml merges into this file at pipeline runtime.
version: 2.1
orbs:
  architect: giantswarm/architect@10.15.1

commands:
  # Pre-steps of the chart-test jobs: pull the images run-tests-with-ats starts
  # (app-test-suite, the kind node) before the orb does, so `docker run` and
  # `kind create cluster` find them locally. The pull is logged in with the
  # registry's credentials from the architect context: ACR throttles all
  # anonymous pulls of a registry together as one identity, an authenticated
  # pull has its own budget. A transient `toomanyrequests` (or any failed pull)
  # is retried with backoff; ACR's Retry-After counts down to the end of its
  # throttling period, at most about a minute, which the longer delays cover.
  pull-chart-test-images:
    parameters:
      registry:
        type: string
      images:
        description: Images to pull, space-separated.
        type: string
    steps:
    - run:
        name: Pull chart-test images (logged in, with retry)
        environment:
          PULL_REGISTRY: << parameters.registry >>
          PULL_IMAGES: << parameters.images >>
        command: |
          delays="15 30 60 60 60"
          retry() {
            for delay in $delays ""; do
              if "$@"; then return 0; fi
              [ -n "$delay" ] || return 1
              echo "Attempt failed, retrying in ${delay}s: $*"
              sleep "$delay"
            done
          }

          # Same input as architect/image-login-to-registries: one registry per
          # line, "visibility registry username_envvar password_envvar push_dev".
          # No xtrace: the loop resolves the password.
          set +x
          username_val=""
          password_val=""
          while read -r _ reg username password _; do
            [ "$reg" = "$PULL_REGISTRY" ] && [ -n "$username" ] && [ -n "$password" ] || continue
            case "$username$password" in *[!a-zA-Z0-9_]*) echo "Invalid credential variable name for $reg" >&2; exit 1 ;; esac
            eval "username_val=\${$username:-}"
            eval "password_val=\${$password:-}"
          done \<<EOF
          $(printf '%s' "${REGISTRIES_DATA_BASE64:-}" | base64 -d)
          EOF
          login() {
            printf '%s' "$password_val" | docker login "$PULL_REGISTRY" --username "$username_val" --password-stdin
          }
          if [ -z "$username_val" ] || [ -z "$password_val" ]; then
            echo "No $PULL_REGISTRY credentials in the job's context: pulling anonymously."
          elif ! retry login; then
            echo "Login to $PULL_REGISTRY failed: pulling anonymously."
          fi

          for image in $PULL_IMAGES; do
            if ! retry docker pull "$image"; then
              echo "Pulling $image failed after every retry." >&2
              exit 1
            fi
          done

workflows:
  build:
    jobs:
    - architect/go-build:
        name: go-build
        binary: starboard-exporter
        context: architect
        # Run unit tests through `make test` rather than the orb's hardcoded
        # `go test ./...`, so CI and local agent runs use the same command.
        # The generic Makefile target is `go test ./...`; repos that need more
        # (-race, integration suites, govulncheck, helm-unittest, CRD-freshness)
        # override their own `make test`. See devctl makefile gen and the
        # make-target-ci-interface ADR.
        test_target: test
        filters:
          tags:
            only: /^v.*/

    # Branch builds (opt-in): amd64 dev image to gsoci for PR validation,
    # coupled with the branch chart push below. v9's push-to-registries always
    # uses buildx; platforms is pinned to amd64 to keep branch builds fast.
    - architect/push-to-registries:
        context: architect
        name: push-to-registries
        platforms: linux/amd64
        requires:
        - go-build
        filters:
          branches:
            ignore:
            - main
            - /^release-v?[0-9]+(\.[0-9]+)?\.x$/

    # Tag builds: push multi-arch image to gsoci + gsociprivate. Aliyun is
    # handled by the sync-china-registry job below (orb's split-china-push
    # mechanism), so the buildx push no longer crosses the Pacific.
    - architect/push-to-registries:
        context: architect
        name: push-to-registries-release
        split-china-push: true
        requires:
        - go-build
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/

    # Mirror gsoci -> Aliyun via the in-China giantswarm/galaxy-runner. Runs
    # in parallel with the chart catalog push; Aliyun mirror failures do NOT
    # block the chart publish.
    - architect/sync-china-registry:
        context: architect
        name: sync-china-registry
        requires:
        - push-to-registries-release
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/

    # build-chart: package + lint via app-build-suite and persist the archive
    # (no push). Shared by the branch and tag paths -- branches get build + test
    # only by default.
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: build-chart
        app_catalog: default-catalog
        app_catalog_test: default-test-catalog
        chart: starboard-exporter
        push_to_appcatalog: false
        push_to_oci_registry: false
        persist_chart_archive: true
        # app-build-suite fails a chart whose gsoci image references the registry
        # does not carry. build-chart runs before this pipeline pushes its own
        # image (a branch without branchPublish never pushes it), so that image
        # at the version the chart is stamped with is exempt here; every other
        # reference, the mirrored third-party images included, is resolved.
        # push-chart and push-chart-release require the image job and resolve
        # all of them.
        pre-steps:
        - run:
            name: Exempt this pipeline's own image from the image reference check
            command: echo 'export ABS_HELM_IMAGE_REFERENCE_VALIDATOR_OWN_IMAGE=gsoci.azurecr.io/giantswarm/starboard-exporter' >> "$BASH_ENV"
        requires:
        - go-build
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main
            - /^release-v?[0-9]+(\.[0-9]+)?\.x$/

    # Branch: run chart tests after build-chart. When branchPublish pushes a dev
    # image, the test also waits on push-to-registries -- run-tests-with-ats
    # deploys the chart, which pulls that image from gsoci, and gating on the
    # push avoids an ImagePullBackOff race. The architect context carries the
    # registry credentials the job hands to its kind node, so the chart can pull
    # private images (gsociprivate) without imagePullSecrets. The kind cluster
    # the job creates takes its configuration (feature gates, runtime config,
    # patches, extra nodes) from .ats/kind-config.yaml when the repo carries one
    # -- repo-owned, like .ats/main.yaml -- and its resource class from
    # gen.ci.atsResourceClass in giantswarm/github (the orb default is medium).
    # Its pre-steps pull the images it starts logged in and with retry (see
    # pull-chart-test-images above).
    - architect/run-tests-with-ats:
        name: execute-chart-tests
        context: architect
        app-test-suite_container_tag: "1.0.3"
        # app-test-suite 1.x provisions no cluster: the job creates the kind
        # cluster and runs the pinned image against its kubeconfig.
        create_kind_cluster: true
        kind_node_image: "gsoci.azurecr.io/giantswarm/kind-node:v1.37.0"
        pre-steps:
        - pull-chart-test-images:
            registry: gsoci.azurecr.io
            images: "gsoci.azurecr.io/giantswarm/app-test-suite:1.0.3 gsoci.azurecr.io/giantswarm/kind-node:v1.37.0"
        requires:
        - build-chart
        - push-to-registries
        filters:
          branches:
            ignore:
            - main
            - /^release-v?[0-9]+(\.[0-9]+)?\.x$/

    # Branch chart push (opt-in): publish the dev chart after tests + the amd64
    # branch image, coupled with push-to-registries above.
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: push-chart
        app_catalog: default-catalog
        app_catalog_test: default-test-catalog
        chart: starboard-exporter
        requires:
        - execute-chart-tests
        - push-to-registries
        filters:
          branches:
            ignore:
            - main
            - /^release-v?[0-9]+(\.[0-9]+)?\.x$/

    # Tag: push the chart after build-chart (+ the gsoci image). The chart
    # tests ran on the branch (execute-chart-tests) and the tag is cut from the
    # merge commit of a PR whose branch run tested this tree, so they are not
    # re-run here (atsOnRelease brings the tag-time run back). Make the
    # ci/circleci statuses required checks on the default branch, with
    # up-to-date branches (strict), so a PR cannot merge before that run is
    # green. Intentionally does NOT depend on sync-china-registry so the chart
    # catalog can publish even if the in-China Aliyun mirror is slow or fails.
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: push-chart-release
        app_catalog: default-catalog
        app_catalog_test: default-test-catalog
        chart: starboard-exporter
        requires:
        - build-chart
        - push-to-registries-release
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/
