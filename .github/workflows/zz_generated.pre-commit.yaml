name: pre-commit

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HELM_DOCS_VERSION: "1.14.2"

jobs:
  pre-commit:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python environment
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      - name: Install helm-docs
        uses: giantswarm/install-binary-action@5bef88f65012037dd836117c8d344b21bb559854 # v4.1.0
        with:
          binary: helm-docs
          version: "${{ env.HELM_DOCS_VERSION }}"
          download_url: "https://github.com/norwoodj/helm-docs/releases/download/v${version}/helm-docs_${version}_Linux_x86_64.tar.gz"
          tarball_binary_path: "helm-docs"
          smoke_test: "${binary} --version"
      - name: Set up Go environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      # setup-go restores its cache only on an exact go.sum match. The
      # restore-keys prefix lets a PR that changes go.sum start from the
      # latest cache instead of a cold build.
      - name: Restore Go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: pre-commit-go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            pre-commit-go-${{ runner.os }}-
      - name: Install goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.52.0
      - name: Install golangci-lint
        uses: giantswarm/install-binary-action@5bef88f65012037dd836117c8d344b21bb559854 # v4.1.0
        with:
          binary: golangci-lint
          version: "2.15.0"
          download_url: "https://github.com/golangci/golangci-lint/releases/download/v${version}/${binary}-${version}-linux-amd64.tar.gz"
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: List installed Python packages
        run: python -m pip freeze --local
      - name: Restore pre-commit cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Execute pre-commit hooks
        run: pre-commit run --show-diff-on-failure --color=always --all-files
        env:
          GOGC: "20"
